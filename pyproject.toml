[project]
name = "credit-risk-mcp"
version = "0.1.0"
description = "MCP server exposing a Home Credit Default Risk XGBoost model as callable tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pinned to match the environment the model was trained in
    # (home-credit-default/.venv) so the pickled model unpickles cleanly.
    "xgboost==3.2.0",
    "shap==0.51.0",
    "scikit-learn==1.8.0",
    "pandas==3.0.2",
    "numpy==2.4.4",
    "pydantic>=2.7",
    "mcp[cli]>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
# Run the remote HTTP server:  uv run credit-risk-http
credit-risk-http = "credit_risk_mcp.server:serve_http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
